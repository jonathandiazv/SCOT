.flow.dash { stroke: #566475; stroke-width: 1.3; stroke-dasharray: 5 4; }
.ah { fill: #1f6feb; } .ah2 { fill: #566475; }
.step circle { fill: #1f6feb; } .step.sec circle { fill: #566475; }
.step text { fill: #ffffff; font-size: 11.5px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.note { font-size: 11px; fill: #566475; }
</style>
      <title id="svgt">Flux : opérateur, app web, Blob, Event Grid, Function, SQL ; entraînement local et dépôt du modèle</title>
