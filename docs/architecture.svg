<svg viewBox="0 0 1160 540" role="img" aria-labelledby="svgt" xmlns="http://www.w3.org/2000/svg"><style>
text { font-family: "IBM Plex Sans", "Segoe UI", Arial, sans-serif; }
.z-se { fill: #eef6ee; stroke: #9cc59e; }
.z-fr { fill: #eef3fb; stroke: #9db6dc; }
.z-pc { fill: #f7f1e8; stroke: #d4bb92; }
.zlabel { font-family: Consolas, "IBM Plex Mono", monospace; font-size: 11px; fill: #566475; letter-spacing: .04em; }
.box { fill: #ffffff; stroke: #c9d3de; stroke-width: 1.2; }
.box.key { stroke: #1f6feb; stroke-width: 1.8; }
.b1 { font-size: 13.5px; font-weight: 600; fill: #16202b; }
.b2 { font-size: 11.5px; fill: #16202b; }
